name: Quality gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  passenger-mobile:
    name: Passenger mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/passenger-mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/passenger-mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Verify Expo configuration
        run: npm run doctor

      - name: Audit production dependencies
        run: npm run audit:production

  admin-dashboard:
    name: Admin dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin-dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-dashboard/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm run audit:production

  driver-mobile:
    name: Driver mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/driver-mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/driver-mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Verify Expo configuration
        run: npm run doctor

      - name: Audit production dependencies
        run: npm run audit:production

  backend-api:
    name: Backend API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: rydo
          POSTGRES_USER: rydo
          POSTGRES_PASSWORD: rydo_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rydo -d rydo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__RydoDatabase: Host=127.0.0.1;Port=5432;Database=rydo;Username=rydo;Password=rydo_local
    defaults:
      run:
        working-directory: apps/backend-api

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/backend-api/global.json
          cache: true
          cache-dependency-path: apps/backend-api/**/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore Rydo.Backend.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format Rydo.Backend.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Rydo.Backend.slnx --no-restore --configuration Release

      - name: Build deployment image
        run: docker build --file Dockerfile --tag rydo-api:ci .

      - name: Verify database migration
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes --no-build --configuration Release --project src/Rydo.Infrastructure --startup-project src/Rydo.Api
          dotnet tool run dotnet-ef migrations script --idempotent --no-build --configuration Release --project src/Rydo.Infrastructure --startup-project src/Rydo.Api --output ${{ runner.temp }}/rydo-migrations.sql
          dotnet tool run dotnet-ef database update --no-build --configuration Release --project src/Rydo.Infrastructure --startup-project src/Rydo.Api

      - name: Verify row-level security
        run: |
          docker run --rm --network host \
            --env PGPASSWORD=rydo_local \
            --volume "$PWD/scripts:/scripts:ro" \
            --entrypoint psql \
            postgis/postgis:17-3.5-alpine \
            --host 127.0.0.1 \
            --username rydo \
            --dbname rydo \
            --file /scripts/verify-rls.sql

      - name: Test
        run: dotnet test Rydo.Backend.slnx --no-build --configuration Release

      - name: Report vulnerable dependencies
        run: dotnet list Rydo.Backend.slnx package --include-transitive --vulnerable
