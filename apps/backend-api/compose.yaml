services:
  database:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: rydo
      POSTGRES_USER: rydo
      POSTGRES_PASSWORD: rydo_local
    ports:
      - "5432:5432"
    volumes:
      - rydo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rydo -d rydo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rydo-postgres-data:
